services:
  matrix-api:
    build: ./matrix-api
    ports:
      - "${PUBLIC_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      STATISTICS_URL: http://statistics-api:3000
      STATISTICS_TIMEOUT: ${STATISTICS_TIMEOUT:-3s}
    depends_on:
      statistics-api:
        condition: service_healthy
    networks: [public, backend]
    read_only: true
    healthcheck:
      test: [CMD, /matrix-api, healthcheck]
      interval: 5s
      timeout: 3s
      retries: 5
  statistics-api:
    build: ./statistics-api
    environment:
      PORT: "3000"
    networks: [backend]
    read_only: true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
networks:
  public: {}
  backend:
    internal: true
